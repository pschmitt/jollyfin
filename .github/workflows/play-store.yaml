name: Play Store Release

# Runs on the same "vX.Y.Z" tags release.yaml publishes GitHub releases from, always building a
# signed AAB for :app:phone - TV isn't covered by Play Store publishing here, matching
# screenshots.yaml's own existing scope. Delegates the actual build/publish to
# pschmitt/android-app-ci's reusable play-store.yaml, which additionally requires the repository
# variable PLAY_PUBLISH_ENABLED=true and a PLAY_SERVICE_ACCOUNT_JSON secret - neither exists until
# those are deliberately set up in Settings > Secrets and variables, so a tag push safely fails
# loudly (see that workflow's publish-gate job) rather than silently publishing on a fresh
# checkout.
#
# versionCode/versionName come from buildSrc/src/main/kotlin/Versions.kt, the same source
# release.yaml's own build already relies on - bump that before tagging, same as any other
# release. No override input here (unlike nyetbox/augh/syncwich) since jollyfin never had one.

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the bundle to the Play internal-testing track"
        required: true
        default: false
        type: boolean

jobs:
  play-store:
    uses: pschmitt/android-app-ci/.github/workflows/play-store.yaml@main
    with:
      application-id: dev.pschmitt.jollyfin
      artifact-label: jollyfin
      gradle-bundle-task: ':app:phone:bundleRelease'
      # AGP names the output directory after the "libre" flavor (e.g.
      # app/phone/build/outputs/bundle/libreRelease/phone-libre-release.aab) - glob instead of a
      # literal path, same as the original hand-rolled `find ... -iname '*.aab'` step did.
      aab-path: 'app/phone/build/outputs/bundle/**/*.aab'
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    secrets: inherit
