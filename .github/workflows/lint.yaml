name: Lint

# Dispatchable on demand in addition to its normal push/PR gating. Delegates to
# pschmitt/android-app-ci's reusable lint workflow (ktfmt + Android Lint, with the ktfmt
# auto-fix-PR behavior) - see that repo's README for what it does.
#
# This adds an Android Lint (`./gradlew lintDebug`, run against both app/phone and app/tv since
# it's unqualified) job that jollyfin's lint.yaml didn't run before - if it fails on the first run
# here, that's surfacing pre-existing lint debt, not something this migration introduced. jollyfin
# has no app/lint-baseline.xml, so that check is skipped.
on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

jobs:
  lint:
    uses: pschmitt/android-app-ci/.github/workflows/lint.yaml@main
    with:
      lint-baseline-path: ''
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
