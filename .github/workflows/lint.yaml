name: Lint

# Dispatchable on demand in addition to its normal push/PR gating. Delegates to
# pschmitt/android-app-ci's reusable lint workflow (ktfmt + Android Lint, with the ktfmt
# auto-fix-PR behavior) - see that repo's README for what it does.
#
# enable-android-lint is off for now: jollyfin's lint.yaml never ran Android Lint before, and
# turning it on here immediately surfaces a pre-existing, unrelated failure (ExtraTranslation on
# settings/src/main/res/values-da/strings.xml:16's pref_player_chapter_markers_summary - present
# in ~23 locale strings.xml files but missing from the base values/strings.xml). Flip this to true
# once that's triaged (either add the missing base-locale string or fix the actual mismatch).
# jollyfin has no app/lint-baseline.xml either way, so that check would be skipped regardless.
on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

jobs:
  lint:
    uses: pschmitt/android-app-ci/.github/workflows/lint.yaml@main
    with:
      lint-baseline-path: ''
      enable-android-lint: false
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
